[workspace]
resolver = "3"
members = ["bluemoon_authentication",
    "bluemoon_database"
]

[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
bluemoon_database = { path = "./bluemoon_database" }
bluemoon_authentication = { path = "./bluemoon_authentication" }

tokio = {
    version = "1",
    features = [
        "net",
        "macros",
        "rt-multi-thread"
    ]
}
warp = {
    version = "0.4",
    features = [ "server" ],
}
toml = {
    version = "1.1",
    default-features = false,
    features = [ "parse", "serde" ]
}

log = "0.4.35"
http = "1.5.0"
serde_json = "1.0.154"
