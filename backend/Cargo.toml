[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {
    version = "1",
    features = [
        "net",
        "macros",
        "rt-multi-thread"
    ]
}
warp = {
    version = "0.4",
    features = [ "server" ],
}
toml = {
    version = "1.1",
    default-features = false,
    features = [ "parse", "serde" ]
}
rusqlite = {
    version = "0.41.1",
    default-features = false,
}
sha2 = {
    version = "0.10",
    default-features = false,
}
log = "0.4.35"
http = "1.5.0"
base64 = "0.22.1"
