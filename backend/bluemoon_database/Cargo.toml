[package]
name = "bluemoon_database"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = {
    version = "0.41.1",
    default-features = false,
}
tokio = {
    version = "1",
    features = [ "sync" ],
}
warp = {
    version = "0.4",
    default-features = false,
}
serde = {
    version = "1.0.229",
    features = [ "derive" ],
}

[target.'cfg( target_os = "windows" )'.dependencies]
rusqlite = { version = "0.41.1", features = [ "bundled" ] }
